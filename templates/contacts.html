{% extends "base.html" %}
{% block title %}Контакти - Моє портфоліо{% endblock %}
{% block content %}
<h1>Контакти</h1><p>Зв'яжіться зі мною за допомогою форми нижче:</p>
<form method="POST" class="mt-3">
<div class="mb-3"><label for="name" class="form-label">Ваше ім'я</label><input type="text" class="form-control" id="name" name="name" required></div>
<div class="mb-3"><label for="email" class="form-label">Email</label><input type="email" class="form-control" id="email" name="email" required></div>
<div class="mb-3"><label for="message" class="form-label">Повідомлення</label><textarea class="form-control" id="message" name="message" rows="4" required></textarea></div>
<button type="submit" class="btn btn-primary">Надіслати</button></form>
{% endblock %}
