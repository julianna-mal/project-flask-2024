```html
{% extends "base.html" %}

{% block title %}Вхід{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Вхід</h2>

    <form method="POST" action="{{ url_for('users.login') }}">
        <div class="mb-3">
            <label for="username" class="form-label">Логін</label>
            <input
                type="text"
                class="form-control"
                id="username"
                name="username"
                required
            >
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Пароль</label>
            <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                required
            >
        </div>

        <button type="submit" class="btn btn-primary">Увійти</button>
    </form>

    <p class="mt-3">
        Тестові дані: логін <strong>admin</strong>, пароль <strong>12345</strong>
    </p>
</div>
{% endblock %}
```
