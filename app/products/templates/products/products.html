{% extends "base.html" %}
{% block title %}Список товарів{% endblock %}
{% block content %}
<h2>Наші товари</h2>
<ul>
    {% for p in products %}
        <li>
            <a href="{{ url_for('products.product_detail', product_id=p.id) }}">{{ p.name }}</a> - {{ p.price }}$
        </li>
    {% endfor %}
</ul>
{% endblock %}
