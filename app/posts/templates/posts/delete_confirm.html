
{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Видалити публікацію?</h2>
    <p>Ви справді хочете видалити «{{ post.title }}»?</p>

    <form method="POST">
        <button type="submit" class="btn btn-danger">Так, видалити</button>
        <a href="{{ url_for('posts.detail_post', post_id=post.id) }}"
           class="btn btn-secondary">Скасувати</a>
    </form>
</div>
{% endblock %}
