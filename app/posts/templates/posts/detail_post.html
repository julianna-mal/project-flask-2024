
{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>{{ post.title }}</h1>

    <p>Автор: {{ post.author }}</p>
    <p>Категорія: {{ post.category }}</p>
    <p>Дата: {{ post.posted.strftime('%d.%m.%Y %H:%M') }}</p>

    <div>{{ post.content }}</div>

    <a href="{{ url_for('posts.update_post', post_id=post.id) }}"
       class="btn btn-warning mt-3">Редагувати</a>

    <a href="{{ url_for('posts.delete_post', post_id=post.id) }}"
       class="btn btn-danger mt-3">Видалити</a>

    <a href="{{ url_for('posts.all_posts') }}"
       class="btn btn-secondary mt-3">Назад</a>
</div>
{% endblock %}
