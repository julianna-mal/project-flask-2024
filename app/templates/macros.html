
{% macro render_field(field, css_class="form-control") %}
<div class="mb-3">
    {{ field.label(class="form-label") }}
    {{ field(class=css_class) }}

    {% if field.errors %}
        <div class="text-danger">
            {% for error in field.errors %}
                <small>{{ error }}</small><br>
            {% endfor %}
        </div>
    {% endif %}
</div>
{% endmacro %}
