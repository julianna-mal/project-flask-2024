<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Моє портфоліо{% endblock %}</title>
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
   
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('resume') }}">Моє резюме</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('resume') }}">Резюме</a>
                <a class="nav-link" href="{{ url_for('contacts') }}">Контакти</a>
            </div>
        </div>
    </nav>

   
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Футер -->
    <footer class="text-center mt-5 py-4 bg-light">
        <p>&copy; 2026 Моє портфоліо. Лабораторна робота №2.</p>
    </footer>
</body>
</html>
