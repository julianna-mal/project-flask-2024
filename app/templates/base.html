<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Моє портфоліо{% endblock %}</title>
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
   
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('main.resume') }}">Моє резюме</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('main.resume') }}">Резюме</a>
                <a class="nav-link" href="{{ url_for('main.contacts') }}">Контакти</a>
            </div>
        </div>
    </nav>

    <li class="nav-item">
    <a class="nav-link" href="{{ url_for('posts.all_posts') }}">
        Публікації
    </a>
</li>
   
   <div class="container">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }} mt-3">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}

</div>

    <!-- Футер -->
    <footer class="text-center mt-5 py-4 bg-light">
        <p>&copy; 2026 Моє портфоліо. Лабораторна робота №2.</p>
    </footer>
</body>
</html>
